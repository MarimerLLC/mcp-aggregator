# Internet-facing endpoint for claude.ai custom connectors and other cloud clients.
# Tailscale Funnel publishes https://mcp-aggregator-public.<tailnet>.ts.net and forwards to the
# aggregator's public listener (port 8081), which serves only MCP + OAuth and requires a token.
# The tailnet-only ingress.yaml (REST admin API, Scalar, unauthenticated MCP) is unchanged.
#
# The proxy's tag must be one the tailnet ACL permits for the operator AND must carry the funnel
# attribute in the tailnet policy file, e.g.
#   "nodeAttrs": [{ "target": ["tag:k8s-operator"], "attr": ["funnel"] }]
# Without tailscale.com/tags the operator falls back to its PROXY_TAGS default (tag:k8s); if the
# ACL rejects that tag the proxy never comes up and the reason is only in the operator log.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-aggregator-public
  namespace: mcp-aggregator
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: tag:k8s-operator
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: mcp-aggregator
      port:
        number: 8081
  tls:
    - hosts:
        - mcp-aggregator-public
